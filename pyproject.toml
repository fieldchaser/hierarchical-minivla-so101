[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-minivla-so101"
version = "0.1.0"
description = "A simulation-first, language-conditioned manipulation research project for SO-101"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
sim = ["mujoco>=3.3"]

[tool.setuptools.packages.find]
where = ["src"]

